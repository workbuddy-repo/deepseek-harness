# DeepSeek Harness —— 单机部署
#
# 镜像由 GitHub Actions 构建并推送到 GitHub Container Registry：
#   ghcr.io/workbuddy-repo/deepseek-harness
# 每次正式版发布自动重建，latest 跟随最新的非 alpha 版本；也可用 DSH_VERSION 锁定。
#
# 持久化映射：
#   ./data       -> /data       会话日志、凭证、profile、已安装插件（DSH_HOME）
#   ./workspace  -> /workspace  工作空间，agent 读写项目的根
#
# 首次启动前先让宿主目录归属容器内的 uid（默认 10001）：
#   mkdir -p data workspace && sudo chown -R 10001:10001 data workspace
#
# 用法：
#   docker compose pull
#   docker compose up -d
#   docker logs dsh | grep 'token='    # 取带 token 的启动 URL

name: dsh

services:
  dsh:
    # 直接用 CI 构建好的镜像，不在本地编译
    image: ghcr.io/workbuddy-repo/deepseek-harness:${DSH_VERSION:-latest}
    container_name: ${DSH_CONTAINER_NAME:-dsh}
    restart: unless-stopped

    # 默认只绑回环，避免把端口直接暴露到公网；需要局域网访问改成 0.0.0.0
    # 同时把访问用的 authority 加进 DSH_TRUSTED_HOSTS，否则接口返回 403。
    ports:
      - "${DSH_BIND_ADDR:-127.0.0.1}:${DSH_PORT:-3080}:3080"

    environment:
      # 模型凭据：留空则启动后在 Settings → Models 里配
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 浏览器访问用的 authority，空格分隔
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-localhost 127.0.0.1}
      # 仅影响启动时打印/广告的 URL，不授予信任
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-}
      # read-only / workspace-write / danger-full-access
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}

    # 与宿主目录属主对齐；宿主用户 uid 不是 10001 时用 DSH_UID/DSH_GID 覆盖
    user: "${DSH_UID:-10001}:${DSH_GID:-10001}"
    working_dir: /workspace

    volumes:
      # 持久化状态：会话日志、凭证、profile、插件
      - ./data:/data
      # 工作空间：agent 的默认工作目录，也是它读写项目的根
      - ./workspace:/workspace

    # dsh 收到 SIGTERM 后给插件树 5 秒优雅处置，留足余量
    stop_grace_period: 20s

    # 镜像自带 HEALTHCHECK，这里不重复声明
