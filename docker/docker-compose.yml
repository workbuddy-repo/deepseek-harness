services:
  dsh:
    build:
      context: .
      args:
        DSH_VERSION: 0.2.1-rc.2
        NODE_VERSION: "24"
    image: deepseek-harness:0.2.1-rc.2
    container_name: dsh
    ports:
      - "3080:3080"
    environment:
      # 模型凭据：宿主机 .env 或 shell 环境注入；也可启动后在 Settings → Models 里配
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 浏览器访问用的 authority：用 localhost 访问则无需额外声明；
      # 用局域网 IP / 域名访问时必须列在这里，否则每个 API 调用都返回 403。
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-localhost 127.0.0.1}
      # 仅影响启动时打印的 URL，不授予信任
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-http://localhost:3080/}
    volumes:
      # 会话日志、凭证、profile、已安装插件都在 DSH_HOME 下，必须持久化
      - dsh-home:/data
      # 项目目录：dsh 以进程工作目录作为默认工作区
      - ./workspace:/workspace
    # dsh 收到 SIGTERM 后给插件树 5 秒优雅处置；默认 10s 通常够，留余量
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  dsh-home:
